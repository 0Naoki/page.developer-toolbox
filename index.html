<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ブラウザ内で完結する開発者向けユーティリティ集" />
    <!-- 外部サイトへのリンクを開いたときに、このページのURLを送らない -->
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <!--
      正式な公開先はここだけ（README・SECURITY.md の「正式な公開先」）。複製したサイトと区別できるよう、検索エンジンと共有のカードに示す。
      公開先を移したときは、canonical と og:url を一緒に直す（src/indexHtml.test.ts が同じ URL かを確かめる）
    -->
    <link rel="canonical" href="https://0naoki.github.io/page.developer-toolbox/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://0naoki.github.io/page.developer-toolbox/" />
    <meta property="og:title" content="Dev Toolbox" />
    <meta property="og:description" content="ブラウザ内で完結する開発者向けユーティリティ集（17ツール）。入力は外部に送信しません。" />
    <meta property="og:locale" content="ja_JP" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Dev Toolbox</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p class="noscript-message">このアプリは JavaScript で動いています。ブラウザの設定で JavaScript を有効にしてください。</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
