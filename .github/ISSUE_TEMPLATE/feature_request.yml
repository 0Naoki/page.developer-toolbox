name: 機能の要望
description: 新しいツールの追加や、既存ツールの改善の提案
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        このアプリは「入力内容を外部へ送信しない」ことを前提にしています。外部のサービスと通信する機能（API の呼び出しなど）は追加できません。

  - type: dropdown
    id: kind
    attributes:
      label: 種類
      options:
        - 新しいツールの追加
        - 既存ツールの改善
        - 全体（サイドバー・検索・保存設定など）
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 困っていること・使いたい場面
      description: どんな作業で、何に困っているかを書いてください。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する内容
      description: 入力と出力の例があると検討しやすくなります（実在する秘密情報は含めないでください）。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: ほかに検討した方法
      description: 既存のツールの組み合わせで代用している方法などがあれば。
